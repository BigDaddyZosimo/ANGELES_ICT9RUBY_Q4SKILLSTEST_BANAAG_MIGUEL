<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f2f2f2; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .box { background: #fff; border-radius: 10px; padding: 2rem 1.75rem; width: 300px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h2 { font-size: 22px; font-weight: 700; color: #111; margin-bottom: 1.5rem; }
    label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; }
    input[type=text], input[type=password] { width: 100%; background: #f5f5f5; border: none; border-radius: 6px; padding: 9px 12px; font-size: 13px; color: #222; outline: none; margin-bottom: 12px; }
    input:focus { background: #ebebeb; }
    .stay { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #aaa; margin-bottom: 4px; }
    .notice { font-size: 10px; color: #ccc; margin-bottom: 1rem; }
    .btns { display: flex; gap: 8px; margin-bottom: 1rem; }
    .btn-main { background: #1a1a2e; color: #fff; border: none; border-radius: 20px; padding: 8px 20px; font-size: 13px; cursor: pointer; }
    .btn-main:hover { background: #2c2c4e; }
    .btn-sec { background: #fff; color: #555; border: 1px solid #ddd; border-radius: 20px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
    .forgot { font-size: 11px; color: #bbb; text-decoration: underline; cursor: pointer; display: block; text-align: center; }
    .foot { text-align: right; font-size: 10px; color: #ccc; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Login</h2>
    <label>Username</label>
    <input type="text" id="user" placeholder="Enter here">
    <label>Password</label>
    <input type="password" id="pass" placeholder="Enter here">
    <div class="stay">
      <input type="checkbox" id="stay" style="width:auto;margin:0;">
      <label for="stay" style="margin:0;font-size:11px;color:#aaa;">Stay logged in</label>
    </div>
    <p class="notice">Your session will stay online on this device.</p>
    <div class="btns">
      <button class="btn-main" onclick="doLogin()">Login</button>
      <button class="btn-sec" onclick="clearF()">Cancel</button>
    </div>
    <span class="forgot">Forgot username / password?</span>
    <p class="foot">Student Name | Grade &amp; Section</p>
  </div>
  <script>
    function doLogin() {
      var u = document.getElementById("user").value;
      var p = document.getElementById("pass").value;
      if (u == "" || p == "") { alert("Fill in all fields."); }
      else { window.location.href = "dashboard.html"; }
    }
    function clearF() {
      document.getElementById("user").value = "";
      document.getElementById("pass").value = "";
    }
  </script>
</body>
</html>
