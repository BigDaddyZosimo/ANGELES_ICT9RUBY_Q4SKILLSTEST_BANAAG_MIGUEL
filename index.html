<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Segoe UI',sans-serif;
  background:#f2f2f2;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  width:300px;
  padding:20px;
  background:#fff;
  border-radius:10px;
}

h2{
  font-size:22px;
  margin-bottom:20px;
}

label{
  font-size:12px;
  color:#888;
}

input{
  width:100%;
  padding:8px;
  margin-top:5px;
  margin-bottom:12px;
  border:0;
  border-radius:6px;
  background:#f5f5f5;
}

input:focus{background:#eaeaea}

.stay{
  font-size:11px;
  color:#aaa;
  margin-bottom:5px;
}

.notice{
  font-size:10px;
  color:#ccc;
  margin-bottom:15px;
}

.btns{
  margin-bottom:15px;
}

button{
  padding:8px 15px;
  border-radius:20px;
  border:0;
  cursor:pointer;
  margin-right:5px;
}

.btn-main{
  background:#1a1a2e;
  color:#fff;
}

.btn-main:hover{background:#333}

.btn-sec{
  background:#fff;
  color:#555;
  border:1px solid #ddd;
}

.forgot{
  font-size:11px;
  color:#bbb;
  text-align:center;
  display:block;
  text-decoration:underline;
}

.foot{
  text-align:right;
  font-size:10px;
  color:#ccc;
  margin-top:20px;
}
</style>
</head>
<body>
  <div class="box">
    <h2>Login</h2>
    <label>Username</label>
    <input type="text" id="user" placeholder="Enter here">
    <label>Password</label>
    <input type="password" id="pass" placeholder="Enter here">
    <div class="stay">
      <input type="checkbox" id="stay" style="width:auto;margin:0;">
      <label for="stay" style="margin:0;font-size:11px;color:#aaa;">Stay logged in</label>
    </div>
    <p class="notice">Your session will stay online on this device.</p>
    <div class="btns">
     <a href="notebooks.html">
    <button class="btn-main" onclick="doLogin()">Login</button>
</a>
      <button class="btn-sec" onclick="clearF()">Cancel</button>
    </div>
    <span class="forgot">Forgot username / password?</span>
    <p class="foot">Student Name | Grade &amp; Section</p>
  </div>
  <script>
    function doLogin() {
      var SIR = document.getElementById("user").value;
      var BALA = document.getElementById("pass").value;
      if (SIR == "" || BALA == "") { alert("Fill in all fields."); }
      else { window.location.href = "dashboard.html"; }
    }
    function clearF() {
      document.getElementById("user").value = "";
      document.getElementById("pass").value = "";
    }
  </script>
</body>
</html>
